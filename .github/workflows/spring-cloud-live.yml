# M1074 + M1076 + M1079: the live witnesses join CI — the registry-healthy half this author's machine cannot run.
#
# The Spring Cloud stack's strongest proof is its five LIVE witnesses on the host side:
# verify-redis-live.mjs (real cache-aside read-through against a project-owned Redis on a
# non-default port), the cache wire-parity witness (M1076: single-flight collapse + seeded TTL
# full jitter on a real jar, with an injected slow origin), verify-messaging-live.mjs (real
# publish→consume against a project-owned RabbitMQ, honest UP/DOWN probe),
# verify-messaging-dlq-live.mjs (retry→DLQ failure semantics) and verify-conditional-get-live.mjs
# (M1079: the ETag a frozen contract owes its reader — 200/304/empty-body/wrong-tag, direct and
# through the gateway; the only arm that needs no broker at all). On the authoring machine the
# five witnesses were proven BY HAND or directly on the registry-healthy CI runner; on this runner
# all five are proven by the same scripts with registry-healthy Docker — the one thing the
# author's impaired Docker Desktop could not do.
#
# Run order is load-bearing: build the reactor first, then boot the services against real
# brokers on non-default ports (never this machine's foreign 5672/6379, never clashing with the
# canonical compose side). The cache arms run before the broker arms and share one project-owned
# Redis (16379) sequentially, each with --clean so neither inherits the other's keys or container.
#
# M1113/M1115: the path filter is GONE on purpose — every witness, and then verify-services.yml,
# the web build and the full proof suite, run on EVERY push and PR to master. The four broker
# arms stay where they are; the conditional-GET witness needs no broker and boots LAST of the
# five against the registry it shares with every other arm.
name: spring-cloud-live

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  live-witnesses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build the reactor
        run: mvn -q -B -DskipTests package -f services/pom.xml

      - name: Live Redis read-through witness
        run: node scripts/verify-redis-live.mjs --clean

      - name: Live cache wire-parity witness
        run: node scripts/verify-cache-parity-live.mjs --clean

      - name: Live RabbitMQ witness
        run: node scripts/verify-messaging-live.mjs --clean

      - name: Live RabbitMQ failure-semantics witness
        run: node scripts/verify-messaging-dlq-live.mjs --clean

      - name: Live conditional-GET (ETag / If-None-Match / 304) witness
        run: node scripts/verify-conditional-get-live.mjs

      - name: Install the web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run build

      - name: Run the full proof suite
        run: npm run proof

# This file has never been executed on the authoring machine — that machine's Docker Desktop cannot
# pull a single new image (records in dev/platform-runbook.md and PLAN-LONGTERM.md). On THIS runner
# the same five witnesses are the truth about the reactor against live brokers.
