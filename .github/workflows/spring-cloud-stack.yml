# M1047: the healthy-registry loop this machine cannot run.
#
# The Spring Cloud stack was proven live by scripts/verify-services.mjs (boot, register,
# config round-trip, frozen-contract round-trip, ordered table route, breaker fallback).
# This workflow runs the same checklist on a registry-healthy runner, then the full web
# build + proof suite, on EVERY push or PR to master. It used to be scoped to the service
# side of the repo; the proof suite it runs is the whole tree's, so the frontend half of
# the suite was simply never exercised on a clean runner. Same honesty line: never executed
# in the authoring session.
#
# M1048: the same workflow now also runs the browser floor — the Playwright suite, the
# web build, and the PWA budget gate — so a service-side change that silently breaks a
# screen goes red as well. Same honesty line: never executed in the authoring session.

name: spring-cloud-stack

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build the service reactor
        run: mvn -q -DskipTests package -f services/pom.xml

      - name: Boot the stack and verify it live
        run: node scripts/verify-services.mjs

      - name: Install the web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run build

      - name: Run the full proof suite
        run: npm run proof

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser floor
        run: npx playwright test --reporter=list
