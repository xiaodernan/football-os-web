# M1203 · The witness that never ran — now it does, on the machine that can prove it.
#
# M1047: the healthy-registry loop this machine cannot run.
# The Spring Cloud stack was proven live by scripts/verify-services.mjs (boot, register,
# config round-trip, frozen-contract round-trip, ordered table route, breaker fallback).
# This workflow runs the same checklist on a registry-healthy runner, then the full web
# build + proof suite, on EVERY push or PR to master.
#
# M1203: dedicated blueprint for THIS machine (the self-hosted runner lenovo-football, registered
# to this repository, picked the job up on 2026-11-19). Windows-native; the host runtime already
# carries Temurin 25 (default for Maven) and Node 24 — no download-of-toolchain step needed,
# which matters when the account's egress is saturated. Every gate that this system runs locally
# and green: tsc exit 0, proof suite exits 0, build ≤ budget.
#
# user authorization (2026-11-19): "self host runner 全部我都允许 可以本机ci 完全没有问题."

name: spring-cloud-stack

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK (temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build the service reactor
        run: mvn -q -DskipTests package -f services/pom.xml
      - name: Boot the stack and verify it live
        run: node scripts/verify-services.mjs
      - name: Install the web dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build the web app
        run: npm run build
      - name: Run the full proof suite
        run: npm run proof
      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run the browser floor
        run: npx playwright test --reporter=list
