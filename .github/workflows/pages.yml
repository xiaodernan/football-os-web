name: Deploy Football OS Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Hosted runner queue on this account is saturated; this repo already ships with two dedicated
    # self-hosted Windows runners (lenovo-pages / lenovo-pages-2). The deploy does `npm ci` + a Vite
    # build on the self-hosted hardware — identical output, no queue. The 3-hour update cadence the
    # sync automation expects is kept by committing only the substance.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          BASE_PATH: /football-os-web/
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
