# M1101 / M1167: the live LLM witness joins CI — carefully. The provider refuses hosted CI egress
# outright (policy: the provider answers 403 "this country / region" to datacenter IPs regardless of
# any user-agent; proven twice: from this authoring network WITHOUT a CONNECT proxy (HTTP 403, and the
# runner answered 502 where its upstream failed) and from the GitHub US-East runner without a proxy).
#   · this workflow therefore runs the --degrade-only mode: the full degrade contract is proven on the
#     US runner (405/400/400/400/503 paths, malformed/oversized/key-absent, bundle sk- scan) and the
#     live legs are printed UNVERIFIED rather than green.
#   · the live:: witness was run on the authoring machine through its server-side CONNECT proxy
#     (127.0.0.1:7897, LLM_UPSTREAM_PROXY in .env, never shipped) — there it PASSED 19/19 with the new
#     provider (https://api.aizzz.xyz/v1/gpt-6.1-terra): cold 2250ms→warm 3ms, byte-identical answers,
#     prompt_tokens=4483 / cached_tokens=4224 observed, concurrent identical-ask burst coalesced to ONE
#     real model call. That witness is committed and reproducible via: node scripts/verify-llm-live.mjs
#   · secrets, if any, come from `secrets.LLM_API_KEY` / `LLM_BASE_URL` / `LLM_MODEL`; this workflow
#     never echoes a bearer, never prints checksums, never commits a key.
#   · triggers limited to master push and PR — never forks.

name: spring-cloud-llm-live

on:
  push:
    branches: [master]
    paths:
      - "scripts/llm-proxy.mjs"
      - "scripts/llm-proxy.d.mts"
      - "scripts/verify-llm-live.mjs"
      - "scripts/proof-llm.mjs"
      - "vite.config.ts"
      - "package.json"
      - ".env.example"
      - ".github/workflows/spring-cloud-llm-live.yml"
  pull_request:
    branches: [master]
    paths:
      - "scripts/llm-proxy.mjs"
      - "scripts/llm-proxy.d.mts"
      - "scripts/verify-llm-live.mjs"
      - "scripts/proof-llm.mjs"
      - "vite.config.ts"
      - "package.json"
      - ".env.example"
      - ".github/workflows/spring-cloud-llm-live.yml"

jobs:
  llm-live:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: tsc · build the bundle
        run: npx tsc --noEmit && npm run build

      - name: Degrade-contract witness (the live legs are UNVERIFIED on this egress, honestly)
        run: node scripts/verify-llm-live.mjs --degrade-only

      - name: Browser-bundle sk- scan (direct dist audit)
        run: |
          if grep -rnI --exclude-dir=node_modules -E 'sk-[A-Za-z0-9]{20,}' dist/; then
            echo "FAIL: the bundle carries a key-like token"; exit 1
          fi
          echo "ok   the built browser bundle carries no sk- token"
