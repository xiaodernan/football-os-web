# M1036: the same ports domain/platform.ts pins. proof-services.mjs reads both files,
# so a port that moves here without moving there reddens the gate. The build context is this
# directory: each Dockerfile copies the whole reactor's poms before selecting its own module.
#
# M1043: the stack actually boots under compose. Each service's yml points its registry and its
# config import at localhost, which is only correct when everything shares one OS — inside
# containers it would point at itself. The compose file fixes that with the environment
# variables below (relaxed binding), exactly as the runbook describes for the host stack:
#   EUREKA_CLIENT_SERVICEURL_DEFAULTZONE  -> the in-network registry endpoint
#   SPRING_CONFIG_IMPORT                  -> the in-network config server (league-service only)
# The ports are unchanged; PLATFORM_LIVE is unchanged (false); the web build still boots none
# of this. Rebuild after pulling: `docker compose -f services/docker-compose.yml up --build`.
services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    ports:
      - "8888:8888"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8087:8087"

  league-service:
    build:
      context: .
      dockerfile: league-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8081:8081"
  discipline-service:
    build:
      context: .
      dockerfile: discipline-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8082:8082"

  redis:
    image: redis:7-alpine
    # The cache tier's only real external dependency. The container name is what the cache
    # service dials (SPRING_DATA_REDIS_HOST=redis); on the host stack it dials localhost:6379.
    ports:
      - "6379:6379"

  cache-service:
    build:
      context: .
      dockerfile: cache-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - eureka-server
      - config-server
      - redis
    ports:
      - "8083:8083"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # The messaging tier's broker — the second process the reactor depends on that is not one of
    # its modules. 5672 is AMQP (what the binder dials); 15672 is the management UI. Container name
    # is what the service points at (SPRING_RABBITMQ_HOST=rabbitmq); the host stack dials localhost.
    ports:
      - "5672:5672"
      - "15672:15672"

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka-server
      - config-server
      - rabbitmq
    ports:
      - "8084:8084"
