# M1036: the same three ports domain/platform.ts pins. proof-services.mjs reads both files,
# so a port that moves here without moving there reddens the gate. The build context is this
# directory: each Dockerfile copies the whole reactor's poms before selecting its own module.
services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"

  league-service:
    build:
      context: .
      dockerfile: league-service/Dockerfile
    depends_on:
      - eureka-server
    ports:
      - "8081:8081"
