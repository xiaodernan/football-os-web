# The native "repository" the config server serves. Demo-shaped and honest: a world label the info
# endpoint prints, the league contract/tables resource names the league service resolves through
# @Value, and the discipline clocks resource name the discipline service resolves the same way.
# Nothing here carries production meaning.
footballos:
  world:
    label: Demo World R1
    seasons: 0
  league:
    contract-resource: league-summary.json
    tables-resource: league-tables.json
  discipline:
    clocks-resource: discipline-clocks.json
