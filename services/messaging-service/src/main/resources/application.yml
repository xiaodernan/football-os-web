# Port pinned by domain/platform.ts (messaging: 8084) and read back by proof-services.mjs.
# The messaging tier is the second service with a real out-of-reactor dependency: RabbitMQ. Its
# binder config is the wire-level twin of the pure fold in domain/queue.ts — partitioning by the
# message key keeps per-key order, consumer isolation Auto-requeues a NACK, max-attempts moves a
# poison message to the dead-letter queue, and prefetch is the backpressure water mark (a consumer
# will not pull more than `prefetch` unacked messages, so a slow fleet sheds load instead of flooding).
server:
  port: 8084

spring:
  application:
    name: football-os-messaging
  # Config-server import. It lives at the TOP of spring.* on purpose: Spring Boot 3's
  # config-import machinery reads spring.config.import and nothing else, and the old
  # spring.cloud.config.import key used to live here —
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    function:
      # The functional bean names: a publisher, a processing consumer and a dead-letter sink.
      definition: publishFixtures;processEvents;deadLetter
    stream:
      default-binder: rabbit
      bindings:
        # The publisher emits one message per finished fixture, keyed by the home club.
        # M1071: broker-level partitioning was REMOVED after a live witness exposed two defects.
        # (1) `partition-key-expression: payload.key` was evaluated AFTER the JSON converter turned
        #     the POJO into a byte[], raising EL1008E and 500ing EVERY /publish (sent:0).
        # (2) Reading the key from a header fixed (1), but Rabbit's binder implements partitioning
        #     as ONE QUEUE PER PARTITION and needs one CONSUMER INSTANCE PER PARTITION
        #     (instanceIndex decides which). With a single jar only partition-0 had a queue, so
        #     messages routed to footballos.events-1..7 were silently dropped: sent:8/delivered:1.
        # The correct single-instance topology is ONE shared durable queue consumed by a competing
        # group (`group` + `concurrency: 4`; at-least-once transport, no loss). The 8-shard decision
        # stays a DETERMINISTIC CONSUMER-SIDE semantic in PipelineFunctions.shardOf()/byShard — the
        # wire twin of domain/queue.ts's fold — so the shard census is still real. Honest trade-off:
        # a shared queue with concurrency does not guarantee per-key ordering; this pipeline is a
        # commutative idempotent counter (seen-set), so order carries no meaning here.
        publishFixtures-out-0:
          destination: footballos.events
        processEvents-in-0:
          destination: footballos.events
          group: footballos.pipeline
          consumer:
            # partitioned REMOVED: one shared durable group queue, 4 competing consumers.
            concurrency: 4
            max-attempts: 5
            back-off-initial-interval: 20
            back-off-max-interval: 640
            back-off-multiplier: 2
        # The dead-letter sink: a message that exhausted max-attempts lands here, not in an
        # infinite retry loop. This is the termination guarantee the pure fold also has.
        deadLetter-in-0:
          destination: footballos.events.dlq
          group: footballos.pipeline.dlq
      rabbit:
        bindings:
          publishFixtures-out-0:
            producer:
              # M1071: a CUSTOM routing-key-expression (`'events.' + payload.key`) was removed —
              # after JSON serialization it both failed on byte[] and, once header-fed, produced a
              # key that matched NO consumer binding, silently dropping every message. With no
              # custom expression the non-partitioned producer uses the destination name as the
              # routing key, which the shared `footballos.pipeline` group queue binds to exactly.
              # A topic exchange is kept so the declared exchange type stays stable and the DLQ
              # topology and routing vocabulary remain intact.
              exchange-type: topic
          processEvents-in-0:
            consumer:
              # prefetch is the QOS backpressure gate: at most this many unacked messages per
              # consumer. It is the wire twin of the high-water mark in domain/queue.ts.
              prefetch: 64
              auto-bind-dlq: true
              dlq-name: footballos.events.dlq
              republish-to-dlq: true
              durable-subscription: true
        binder:
          # In-network host is overridden by SPRING_RABBITMQ_HOST under compose; on the host stack
          # it dials localhost:5672. The connection is a single AMQP channel pool over TCP.
          # M1071: these are DEFAULTS only — the binder reads the standard spring.rabbitmq.* below
          # when present (witnessed live: SPRING_RABBITMQ_PORT=5673 redirects the binder's actual
          # connection without setting any SPRING_CLOUD_STREAM_RABBIT_BINDER_* property).
          hosts: localhost
          port: 5672
  # M1071: the AMQP connection settings. `connection-timeout` is the BOUNded TCP handshake — without
  # it the client defaults to 60s, and a broker outage parks a Tomcat worker for a whole minute
  # (the same thread-pool avalanche the cache tier had with Lettuce, M1070). The live witness proves
  # the /messaging/summary broker probe degrades promptly with live:false when RabbitMQ vanishes.
  # These also carry the credentials the project-owned witness container requires; the reactor's
  # compose overrides host/user/pass, and a host with guest/guest on 5672 needs no override.
  rabbitmq:
    connection-timeout: 2000
    template:
      receive-timeout: 2000
      reply-timeout: 2000

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# The wire policy mirrors domain/queue.ts's QUEUE_POLICY. The proof reads these numbers out of the
# yml and refuses a drift between the pure fold and the broker binding — one decision, two readers.
footballos:
  messaging:
    exchange: footballos.events
    dlq: footballos.events.dlq
    base-delay: 20
    cap-delay: 640
    max-attempts: 5
    high-water: 64
    low-water: 16
    shards: 8
