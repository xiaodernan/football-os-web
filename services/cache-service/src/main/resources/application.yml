# Port pinned by domain/platform.ts (cache: 8083) and read back by proof-services.mjs.
# The cache tier is the only service with a real dependency on another process: Redis. Everything
# else in the reactor is self-contained; this one degrades to a direct origin read when Redis is
# down, so the proof and the runbook can boot it without a running Redis and still get data.
server:
  port: 8083

spring:
  application:
    name: football-os-cache
  # Lettuce (the default Redis client under spring-boot-starter-data-redis) speaks RESP over a
  # netty connection — non-blocking IO on the client side, a single TCP socket to Redis, and a
  # connection pool reclaimed under pressure. The host/port below are the networking endpoint the
  # cache tier dials; compose points them at the redis container.
  data:
    redis:
      host: localhost
      port: 6379
      # M1070: Lettuce's DEFAULT command timeout is 60s. When Redis vanishes, every
      # cache read parks a Tomcat worker for that whole minute; a few concurrent
      # misses exhaust the pool and the tier stops answering even AFTER Redis comes
      # back (witnessed live: a single degraded read took 61s and the service stayed
      # unresponsive post-recovery). Bound the RESP round-trip AND the TCP handshake
      # so the origin fallback runs promptly and the degraded path stays O(1) in the
      # number of dead-broker probes. Overridable via SPRING_DATA_REDIS_TIMEOUT /
      # SPRING_DATA_REDIS_CONNECT_TIMEOUT for the live verifier.
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
  # Spring's Redis cache abstraction is configured but unused directly — the controller does its
  # own cache-aside so the hit/miss counters are observable. TTL is the expiry policy: a key older
  # than this is gone, and the next read re-reads the origin. LRU-by-TTL, not LRU-by-recency,
  # because the working set is one key.
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
  config:
    # Optional: the cache service still boots alone (stand-alone) when the config server is not
    # running; when it is, it picks up the label from there instead of the default. This lives at
    # the TOP of spring.* on purpose — Spring Boot 3's config-import machinery reads
    # spring.config.import and nothing else; the old spring.cloud.config.import key was a lie.
    import: optional:configserver:http://localhost:8888

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# The contract-resource is the same frozen file the league service serves; the cache sits in front
# of it. ttl-seconds is the key's lifetime in Redis — the proof reads it, the controller honours it.
# M1075: the second read-through — the frozen TABLES snapshot, one key, same TTL policy and the
# same degrade story as the summary. The gateway already forwards /api/cache/** with StripPrefix=1,
# so /api/cache/league/table/{comp} lands on this module with zero new route.
footballos:
  cache:
    contract-resource: league-summary.json
    ttl-seconds: 60
    tables-resource: league-tables.json
    tables-ttl-seconds: 60
