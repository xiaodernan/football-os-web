# Port pinned by domain/platform.ts (registry: 8761) and read back by proof-services.mjs.
server:
  port: 8761

spring:
  application:
    name: football-os-registry

eureka:
  client:
    # The registry is the one service that does not register with itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
